name: checkly
description: "Checkly — Mobile audit & compliance app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  cupertino_icons: ^1.0.8

  # DI & State
  get_it: ^9.2.1
  watch_it: ^2.1.0

  # Navigation
  go_router: ^17.1.0

  # HTTP & Storage
  dio: ^5.8.0+1
  flutter_secure_storage: ^10.0.0

  # Design
  google_fonts: ^8.0.2

  # Charts
  fl_chart: ^1.0.0
  # Maps (OpenStreetMap — free, no API key)
  flutter_map: ^8.0.0
  latlong2: ^0.9.1

  # Offline (Phase 3)
  drift: ^2.32.1
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0
  uuid: ^4.5.3
  path: ^1.9.1
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  meta: ^1.17.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.4.15
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
