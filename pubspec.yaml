name: checkly
description: "Checkly — Mobile audit & compliance app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # DI & State
  get_it: ^9.2.1
  watch_it: ^2.1.0

  # Navigation
  go_router: ^15.1.2

  # HTTP & Storage
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4

  # Design
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.70.2

  # Offline (Phase 3)
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  uuid: ^4.5.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.25.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
